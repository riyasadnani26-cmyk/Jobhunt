# Search criteria and daily limits. Safe to commit (no personal data).

search:
  keywords:
    - SAP HCM
    - SAP Payroll
    - HRIS
    - HR Technology
    - Payroll Analyst
    - HR Systems Analyst
    - Business Analyst HR
    - Workday HR Technology
  locations:
    - Hyderabad
    - Remote
    - India
  experience_years: [2, 4]     # keep jobs whose stated range overlaps this
  posted_within_days: 7

limits:
  jobs_per_day: 100            # total new jobs collected per day, all sources
  linkedin_browser_per_day: 40 # of those, max from logged-in LinkedIn browsing
  linkedin_people_searches_per_day: 15
  tailor_min_match: 40         # only tailor resumes for jobs scoring >= this (0-100)
  drafts_per_day: 25           # outreach email drafts created per day

# Delays (seconds) between LinkedIn page actions. Keep these human-like.
linkedin_pacing:
  min_delay: 4
  max_delay: 11

sources:
  jsearch: true                # RapidAPI JSearch (Google for Jobs: LinkedIn, Naukri, Indeed, company sites)
  adzuna: true                 # Adzuna India API
  linkedin_browser: true       # your logged-in LinkedIn, run on your own computer

# Skills you genuinely have but which are NOT on your master resume yet.
# The tailoring step may only use skills from the master resume + this list.
verified_extra_skills: []

claude:
  model: claude-opus-5-5
  effort: medium

paths:
  master_resume: data/master_resume.yaml
  database: data/jobhunt.db
  output_dir: output
  gmail_credentials: data/credentials.json
  gmail_token: data/token.json
  browser_profile: data/.browser-profile
